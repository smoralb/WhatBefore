<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#FFF5E1"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#000" stroke-width="4"/>
  <polygon points="350,30 370,60 330,60" fill="#FF6AD5" stroke="#000" stroke-width="3"/>
  <rect x="30" y="230" width="40" height="40" fill="#72EFDD" stroke="#000" stroke-width="3" transform="rotate(10 50 250)"/>
  <circle cx="370" cy="250" r="25" fill="#C77DFF" stroke="#000" stroke-width="3"/>
  
  <!-- Main title -->
  <text x="200" y="100" font-family="Impact, Arial Black, sans-serif" font-size="52" text-anchor="middle" fill="#FF6AD5" stroke="#000" stroke-width="2">What</text>
  <text x="200" y="145" font-family="Impact, Arial Black, sans-serif" font-size="52" text-anchor="middle" fill="#C77DFF" stroke="#000" stroke-width="2">Before!</text>
  
  <!-- VS Divider -->
  <line x1="120" y1="165" x2="280" y2="165" stroke="#000" stroke-width="3"/>
  <text x="200" y="180" font-family="Arial Black, sans-serif" font-size="24" text-anchor="middle" fill="#000">VS</text>
  
  <!-- Description -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">¿Qué evento fue primero?</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">Juego de historia</text>
  
  <!-- Tech stack -->
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#888">React • Supabase • Vite</text>
</svg>