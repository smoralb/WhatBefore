<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <pattern id="memphis-dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#003580"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Card Background with Memphis Pattern -->
  <rect x="0" y="0" width="400" height="500" fill="#0047AB"/>
  <rect x="0" y="0" width="400" height="500" fill="url(#memphis-dots)"/>

  <!-- Inner White Card -->
  <rect x="12" y="12" width="376" height="476" fill="white" stroke="#000" stroke-width="6" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="200" y="60" font-family="Bangers, cursive" font-size="52" text-anchor="middle" fill="#FF6AD5" stroke="#000" stroke-width="3">What</text>
  <text x="200" y="108" font-family="Bangers, cursive" font-size="52" text-anchor="middle" fill="#C77DFF" stroke="#000" stroke-width="3">Before!</text>

  <!-- Score Box -->
  <rect x="40" y="140" width="320" height="130" fill="#FFF44F" stroke="#000" stroke-width="6" filter="url(#shadow)"/>
  <text x="200" y="175" font-family="JetBrains Mono, monospace" font-size="20" font-weight="900" text-anchor="middle" fill="#000" text-transform="uppercase">Score</text>
  <text x="200" y="250" font-family="Bangers, cursive" font-size="80" text-anchor="middle" fill="#002D62">0</text>

  <!-- Stats Row -->
  <g transform="translate(30, 300)">
    <!-- Rounds -->
    <rect x="0" y="0" width="165" height="100" fill="#72EFDD" stroke="#000" stroke-width="6" filter="url(#shadow)"/>
    <text x="82" y="30" font-family="JetBrains Mono, monospace" font-size="16" font-weight="900" text-anchor="middle" fill="#000" text-transform="uppercase">Rounds</text>
    <text x="82" y="85" font-family="Bangers, cursive" font-size="48" text-anchor="middle" fill="#000">0</text>

    <!-- Status -->
    <rect x="185" y="0" width="165" height="100" fill="#C77DFF" stroke="#000" stroke-width="6" filter="url(#shadow)"/>
    <text x="267" y="30" font-family="JetBrains Mono, monospace" font-size="16" font-weight="900" text-anchor="middle" fill="#000" text-transform="uppercase">Status</text>
    <text x="267" y="85" font-family="Bangers, cursive" font-size="48" text-anchor="middle" fill="#000">PLAY</text>
  </g>

  <!-- Website URL -->
  <rect x="100" y="430" width="200" height="36" fill="#000" stroke="#000" stroke-width="4" filter="url(#shadow)"/>
  <text x="200" y="455" font-family="JetBrains Mono, monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFF">whatbefore.game</text>

  <!-- Decorative Shapes -->
  <circle cx="340" cy="430" r="25" fill="#FF6AD5" stroke="#000" stroke-width="4"/>
  <polygon points="60,450 90,480 30,480" fill="#72EFDD" stroke="#000" stroke-width="4"/>

  <!-- Corner Decorations -->
  <rect x="350" y="30" width="24" height="24" fill="#FFF44F" stroke="#000" stroke-width="4" transform="rotate(15, 362, 42)"/>
  <circle cx="60" cy="50" r="18" fill="#C77DFF" stroke="#000" stroke-width="4"/>
</svg>